model: yolo11s.pt
data: data/processed/data.yaml
epochs: 150
imgsz: 640
batch: 16
device: 0
workers: 0
optimizer: AdamW
lr0: 0.001
weight_decay: 0.0005
patience: 30
seed: 42
deterministic: true
amp: true
pretrained: true
cache: false
plots: true
save: true
verbose: true

lora_r: 8
lora_alpha: 8
lora_dropout: 0.05
lora_freeze_bn: true
lora_use_rslora: false
lora_init_lora_weights: gaussian
lora_lr_mult: 0.5
lora_alpha_warmup: 0
lora_layer_decay: 1.0
lora_ortho_weight: 0.0
lora_dropout_end: 0.05
lora_dropout_start_ratio: 1.0
lora_gradient_checkpointing: false
lora_include_head: false
