[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "yolo-train"
version = "0.1.0"
description = "Pipeline leak multi-object detection and customer demo system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.3.240",
    "PyYAML>=6.0",
    "fastapi>=0.116",
    "uvicorn[standard]>=0.35",
    "SQLAlchemy>=2.0",
    "pydantic-settings>=2.10",
    "python-multipart>=0.0.20",
    "Jinja2>=3.1",
    "Pillow>=11.0",
    "opencv-python>=4.10",
    "pandas>=2.2",
    "scipy>=1.14",
    "peft>=0.17",
    "onnx>=1.17",
    "onnxslim>=0.1.71",
    "httpx>=0.28",
    "aiofiles>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "ipykernel>=6.30",
]

[project.scripts]
yolo-train = "yolo_train.train:main"
yolo-eval = "yolo_train.evaluate:main"
yolo-predict = "yolo_train.predict:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests", "training/tests", "backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
